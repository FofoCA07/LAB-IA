# CANDIDATE ONLY. Never combine with the active Compose file.
# Paths resolve from this directory; future promotion requires path review.
services:
  opencode:
    image: ghcr.io/anomalyco/opencode@sha256:bf9d0e84b7cedef436a8f57db4d48767cd5d8fc6604f666335c1cc916b199a97
    pull_policy: never
    container_name: opencode
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    init: true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=256m,mode=1777
    environment:
      HOME: /home/adolf
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
    stdin_open: true
    tty: true
    working_dir: /workspace
    depends_on:
      opencode-gateway:
        condition: service_healthy
    networks:
      front: {}
    volumes:
      - type: bind
        source: ${LAB_WORKSPACE:?Explicit reviewed workspace required}
        target: /workspace
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${LAB_OPENCODE_HOME:?Prepare a separate sanitized HOME first}
        target: /home/adolf
        bind: {create_host_path: false}
      - type: bind
        source: ../../../agentes/agents
        target: /home/adolf/.config/opencode/agents
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./opencode.json
        target: /home/adolf/.config/opencode/opencode.json
        read_only: true
        bind: {create_host_path: false}

  opencode-gateway:
    image: docker.io/library/node@sha256:9f0dde62d10e7ff7a310ecaebd66225f6b46c17e6cb778449a77b05d3541bea2
    pull_policy: never
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    init: true
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    command: [node, /app/launcher.mjs]
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      front:
        interface_name: front0
      upstream:
        interface_name: upstream0
        gw_priority: 1
    volumes:
      - type: bind
        source: ./gateway-launcher.mjs
        target: /app/launcher.mjs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../../proyectos/lab-ia-web/server/opencode-gateway.js
        target: /app/opencode-gateway.mjs
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, node, /app/launcher.mjs, --healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "3"

networks:
  front:
    driver: bridge
    internal: true
    enable_ipv4: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  upstream:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: false
