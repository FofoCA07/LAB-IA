services:
  opencode:
    image: ghcr.io/anomalyco/opencode@sha256:bf9d0e84b7cedef436a8f57db4d48767cd5d8fc6604f666335c1cc916b199a97
    container_name: opencode
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=256m,mode=1777
    init: true
    pids_limit: 256
    stop_grace_period: 30s

    environment:
      HOME: /home/adolf

    stdin_open: true
    tty: true

    working_dir: /workspace

    volumes:
      - "${LAB_WORKSPACE:-../}:/workspace:ro"
      - ${HOME}/.local/share/lab-ia-opencode/home:/home/adolf
      - ../agentes/agents:/home/adolf/.config/opencode/agents:ro
      - ./opencode.json:/home/adolf/.config/opencode/opencode.json:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"
